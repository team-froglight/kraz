name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Builds the library, the editor (which reads Apothecary from GitHub Packages) and the self test's classes.
      # The self test itself needs a GPU and a window; run it locally: ./gradlew :editor:runClientSelfTest
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build :editor:compileSelftestJava --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
      - name: Upload jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kraz
          path: |
            core/build/libs/*.jar
            editor/build/libs/*.jar
          if-no-files-found: error
