modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "kraz"
version = "${mod_version}"
displayName = "Kraz"
authors = "methodial"
description = '''
Scene rendering toolkit and library: build, save, animate and render block scenes, models, items and entities
offscreen or inside any GUI, with MSAA/SSAA antialiasing and post-processing shaders.
'''

[[mixins]]
config = "kraz.mixins.json"

[[dependencies.kraz]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.kraz]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.21.2)"
ordering = "NONE"
side = "CLIENT"
